[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon"
version = "0.6.1"
authors = [
    { name = "Joseph Avatiants (joavat-2009)" }
]
description = "High-performance asynchronous OSINT & network infrastructure perimeter discovery tool"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPL-v3 License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

dependencies = [
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "requests>=2.31.0",
    "python-whois>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/joavat-2009"
Issues = "https://github.com/joavat-2009/Web-Recon/issues"

[project.scripts]
web-recon = "web_recon.recon:arguments"

[tool.pytest.ini_options]
pythonpath = ["src"]

